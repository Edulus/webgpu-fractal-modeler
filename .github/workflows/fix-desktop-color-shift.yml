name: Fix desktop color shift

on:
  push:
    branches:
      - fix/desktop-color-shift

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-color-shift
          fetch-depth: 0

      - name: Patch and test color shifting
        shell: bash
        run: |
          python3 tools/patch_color_shift_desktop.py
          node --check src/fractal-bg.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          tag = '<script type="module">'
          start = s.index(tag) + len(tag)
          end = s.index('</script>', start)
          Path('/tmp/index-script.mjs').write_text(s[start:end])
          PY
          node --check /tmp/index-script.mjs
          node tools/colorcycle.test.js
          node tools/camera.test.js

      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/fix-desktop-color-shift.yml tools/patch_color_shift_desktop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fractal-bg.js index.html tools/colorcycle.test.js .github/workflows/fix-desktop-color-shift.yml tools/patch_color_shift_desktop.py
          git commit -m "Fix desktop colour-shift speed control"
          git push origin HEAD:fix/desktop-color-shift
