name: Fix flick spin all directions

on:
  push:
    branches:
      - fix/flick-spin-all-directions

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flick-spin-all-directions
          fetch-depth: 0

      - name: Patch flick spin
        shell: bash
        run: |
          python3 tools/patch_flick.py
          node --check src/fractal-bg.js
          node --check src/camera.js
          node tools/camera.test.js

      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/fix-flick-spin.yml tools/patch_flick.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fractal-bg.js src/camera.js src/shaders/fractal.wgsl.js tools/camera.test.js .github/workflows/fix-flick-spin.yml tools/patch_flick.py
          git commit -m "Fix flick spin across mouse and both axes"
          git push origin HEAD:fix/flick-spin-all-directions