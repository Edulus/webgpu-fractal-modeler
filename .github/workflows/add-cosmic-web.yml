name: Add Cosmic Web

on:
  push:
    branches: [feature/cosmic-web]

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cosmic-web
          fetch-depth: 0

      - name: Apply Cosmic Web implementation
        run: python3 tools/patch_cosmic_web.py

      - name: Syntax checks
        run: |
          node --check src/fractal-bg.js
          node --check src/shaders/material.wgsl.js
          node --check src/shaders/composite.wgsl.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          tag = '<script type="module">'
          start = s.index(tag) + len(tag)
          end = s.index('</script>', start)
          Path('/tmp/index-script.mjs').write_text(s[start:end])
          PY
          node --check /tmp/index-script.mjs

      - name: Run test suite
        run: |
          for test in tools/*.test.js; do
            echo "== $test =="
            node "$test"
          done

      - name: Commit validated implementation
        run: |
          rm .github/workflows/add-cosmic-web.yml tools/patch_cosmic_web.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/fractal-bg.js src/shaders/material.wgsl.js src/shaders/composite.wgsl.js tools/cosmicweb.test.js .github/workflows/add-cosmic-web.yml tools/patch_cosmic_web.py
          git commit -m "Add Cosmic Web volumetric shape"
          git push origin HEAD:feature/cosmic-web
