name: Fix seamless Shape Explorer entry

on:
  push:
    branches: [fix/seamless-shape-explorer-entry]

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seamless-shape-explorer-entry
          fetch-depth: 0

      - name: Apply seamless Explorer handoff
        run: python3 tools/patch_seamless_explorer.py

      - name: Syntax checks
        run: |
          node --check src/camera.js
          node --check src/fractal-bg.js

      - name: Run full test suite
        run: |
          for test in tools/*.test.js; do
            echo "== $test =="
            node "$test"
          done

      - name: Verify Explorer handoff source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/fractal-bg.js').read_text()
          start = s.index('    setExplorer(on) {')
          end = s.index('    pause() {', start)
          block = s[start:end]
          assert 'adoptCurrentViewAsOrbit()' in block
          assert block.index('adoptCurrentViewAsOrbit()') < block.index('applyCameraMode()')
          assert 'setPalette(' not in block
          assert 'colorPhase =' not in block
          print('Explorer handoff preserves live pose and palette state')
          PY

      - name: Commit validated implementation
        run: |
          rm .github/workflows/fix-seamless-explorer.yml tools/patch_seamless_explorer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/camera.js src/fractal-bg.js tools/camera.test.js .github/workflows/fix-seamless-explorer.yml tools/patch_seamless_explorer.py
          git commit -m "Preserve view when entering Shape Explorer"
          git push origin HEAD:fix/seamless-shape-explorer-entry
