name: Palette faithful cycle final validation

on:
  push:
    branches: [agent/palette-faithful-cycle]

permissions:
  contents: write

concurrency:
  group: palette-faithful-cycle
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[palette-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/palette-faithful-cycle
          fetch-depth: 0

      - name: Apply asserted finalization
        run: |
          node tools/fix-palette-phase.mjs
          node tools/fix-palette-material-details.mjs
          node tools/finalize-palette-cycle.mjs

      - name: JavaScript syntax
        run: |
          node --check src/fractal-bg.js
          node --check src/shaders/fractal.wgsl.js
          node --check src/shaders/material.wgsl.js
          node --check src/shaders/composite.wgsl.js
          node --check src/shaders/attractor.wgsl.js
          node --check tools/colorcycle.test.js

      - name: Compile all WGSL modules in headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 8765 >/tmp/palette-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          ok=0
          for mode in vulkan angle; do
            if [ "$mode" = vulkan ]; then
              FLAGS=(--use-angle=vulkan --enable-features=Vulkan --disable-vulkan-surface --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader)
            else
              FLAGS=(--use-gl=angle --use-angle=swiftshader --use-webgpu-adapter=swiftshader)
            fi
            "$CHROME" --headless=new --no-sandbox --disable-gpu-sandbox \
              --enable-unsafe-webgpu --enable-unsafe-swiftshader \
              "${FLAGS[@]}" --virtual-time-budget=10000 --dump-dom \
              http://127.0.0.1:8765/tools/shader-check.html > /tmp/shader-check.html 2>/tmp/chrome-stderr.log || true
            if grep -q "All shaders compiled." /tmp/shader-check.html; then
              ok=1
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/chrome-stderr.log || true
            cat /tmp/shader-check.html || true
            exit 1
          fi
          grep -q "ok   fractal.wgsl" /tmp/shader-check.html
          grep -q "ok   material.wgsl" /tmp/shader-check.html
          grep -q "ok   composite.wgsl" /tmp/shader-check.html
          grep -q "ok   attractor.wgsl" /tmp/shader-check.html

      - name: Unit tests
        run: |
          for t in tools/*.test.js; do
            echo "== $t =="
            node "$t"
          done

      - name: Renderer and documentation invariants
        run: |
          grep -q "MATERIAL_WGSL" src/fractal-bg.js
          grep -q "colorPhase: 63" src/fractal-bg.js
          grep -q "auxTex" src/fractal-bg.js
          grep -q "fs_material" src/fractal-bg.js
          grep -q "state.colorPhase += (dt / 1000) \* state.colorCycle" src/fractal-bg.js
          ! grep -q "state.colorPhase = .*% 1" src/fractal-bg.js
          ! grep -q "state\.pipelines\.accum" src/fractal-bg.js
          ! grep -q "accumParity" src/fractal-bg.js
          ! grep -q "hueRotate(hdr, TAU \* (.*color" src/shaders/composite.wgsl.js
          grep -q "palette(m.x / m.y + phase)" src/shaders/composite.wgsl.js
          grep -q "u.paletteMode > 0.5 && a.z > 1e-7" src/shaders/composite.wgsl.js
          grep -q "material.wgsl" tools/shader-check.html
          grep -q "Palette-faithful colour cycling" README.md
          grep -q "Palette-coordinate shift rate per second" README.md
          ! grep -q "Hue cycles per second" README.md

      - name: Commit final generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "palette-cycle-migration"
          git config user.email "actions@users.noreply.github.com"
          git add README.md src/fractal-bg.js src/shaders/material.wgsl.js src/shaders/composite.wgsl.js src/shaders/attractor.wgsl.js tools/colorcycle.test.js tools/shader-check.html
          git commit -m "[palette-patch] Finalize palette-faithful colour cycling"
          git push origin HEAD:agent/palette-faithful-cycle
