name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it; never run two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on via the API if it isn't already enabled, so no manual
          # Settings step is needed. If org policy blocks it, enable it by hand
          # under Settings -> Pages -> Source: GitHub Actions and re-run.
          enablement: true

      # No build step: the project is plain HTML/JS/WGSL with no dependencies,
      # so the repo root is uploaded as-is. All asset paths are relative.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
