name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A fresh main deployment supersedes any stale/in-flight Pages run. This keeps
# an abandoned deployment from blocking newer commits indefinitely.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This project has no package manager or build step. The tests are plain
      # Node programs, so run every suite that exists rather than maintaining a
      # second hand-written list that can drift when a new regression test lands.
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js src/shaders/*.js tools/*.test.js; do
            node --check "$f"
          done

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          for f in tools/*.test.js; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on via the API if it isn't already enabled, so no manual
          # Settings step is needed. If org policy blocks it, enable it by hand
          # under Settings -> Pages -> Source: GitHub Actions and re-run.
          enablement: true

      # No build step: the project is plain HTML/JS/WGSL with no dependencies,
      # so the repo root is uploaded as-is. All asset paths are relative.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
