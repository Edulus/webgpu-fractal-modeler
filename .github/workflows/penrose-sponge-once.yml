# Second push: workflow is now registered on the default branch.
name: Apply Penrose Sponge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/penrose-sponge-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add volumetric Penrose model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          shader = 'src/shaders/fractal.wgsl.js'
          replace_once(shader, """//   44  fractalType: f32   (0=mandelbulb, 1=mandelbox, 2=menger, 3=julia,
//                           4=apollonian, 5=spherepack, 6=encrusted,
//                           7=surfacepack, 8=penrose; 9+ are the line-rendered
//                           attractors, which this pass only backgrounds)""", """//   44  fractalType: f32   (0=mandelbulb, 1=mandelbox, 2=menger, 3=julia,
//                           4=apollonian, 5=spherepack, 6=encrusted,
//                           7=surfacepack, 8=penrose relief,
//                           9=penrose sponge; 10+ are the line-rendered
//                           attractors, which this pass only backgrounds)""")

          sponge = r'''
// Volumetric Penrose sponge. Three independently phased Penrose edge fields
// are projected through the XY, YZ, and ZX planes. Pairwise intersections of
// those extruded edge sheets become branching tunnels inside a spherical host.
// The construction is repeated at the parent phi^2 scale, so broad passages
// contain a finer self-similar network rather than a single decorative skin.
fn penroseTunnelNetwork(exy : f32, eyz : f32, ezx : f32, width : f32) -> f32 {
  let sxy = exy - width;
  let syz = eyz - width;
  let szx = ezx - width;
  return min(max(sxy, syz), min(max(syz, szx), max(szx, sxy)));
}

fn dePenroseSponge(pos : vec3<f32>) -> DEResult {
  const R : f32 = 1.28;
  const SCALE : f32 = 0.18;
  const FINE_W : f32 = 0.030;
  const PARENT_W : f32 = 0.062;

  let host = length(pos) - R;
  var res : DEResult;

  // The tunnels only remove material, so outside the host sphere its exact
  // distance is a safe early-out that avoids all six Penrose queries.
  if (host > 0.12) {
    res.dist = host;
    res.trap = 0.28;
    return res;
  }

  let tm = select(u.time, 0.0, u.reducedMotion > 0.5);
  let drift = 0.075 * vec2<f32>(cos(tm * 0.041), sin(tm * 0.037));
  let phXY = drift;
  let phYZ = vec2<f32>(drift.y, -drift.x) + vec2<f32>(0.11, -0.07);
  let phZX = vec2<f32>(-drift.x - drift.y, drift.x) + vec2<f32>(-0.08, 0.13);

  // Small in-plane rotations keep the three extrusions from sharing obvious
  // axial seams while preserving their mutually perpendicular carrier planes.
  let qXY = vec2<f32>(
    0.98480775 * pos.x - 0.17364818 * pos.y,
    0.17364818 * pos.x + 0.98480775 * pos.y) / SCALE;
  let qYZ = vec2<f32>(
    0.93232735 * pos.y - 0.36161543 * pos.z,
    0.36161543 * pos.y + 0.93232735 * pos.z) / SCALE;
  let qZX = vec2<f32>(
    0.81915204 * pos.z + 0.57357644 * pos.x,
   -0.57357644 * pos.z + 0.81915204 * pos.x) / SCALE;

  let childXY = penroseQuery(qXY, phXY);
  let childYZ = penroseQuery(qYZ, phYZ);
  let childZX = penroseQuery(qZX, phZX);
  let parentXY = penroseQuery(qXY / PHI2, phXY);
  let parentYZ = penroseQuery(qYZ / PHI2, phYZ);
  let parentZX = penroseQuery(qZX / PHI2, phZX);

  let edgeXY = max(-childXY.sdf, 0.0) * SCALE;
  let edgeYZ = max(-childYZ.sdf, 0.0) * SCALE;
  let edgeZX = max(-childZX.sdf, 0.0) * SCALE;
  let parentEdgeXY = max(-parentXY.sdf, 0.0) * SCALE * PHI2;
  let parentEdgeYZ = max(-parentYZ.sdf, 0.0) * SCALE * PHI2;
  let parentEdgeZX = max(-parentZX.sdf, 0.0) * SCALE * PHI2;

  let fineTunnels = penroseTunnelNetwork(edgeXY, edgeYZ, edgeZX, FINE_W);
  let parentTunnels = penroseTunnelNetwork(
    parentEdgeXY, parentEdgeYZ, parentEdgeZX, PARENT_W);
  let tunnels = min(fineTunnels, parentTunnels);

  // Signed-distance subtraction: retain the sphere while removing the union of
  // the fine and parent tunnel networks. The scale factor is conservative for
  // the combined projected fields and stabilizes sphere tracing near junctions.
  res.dist = max(host, -tunnels) * 0.38;

  let kindMix = (childXY.kind + childYZ.kind + childZX.kind) / 3.0;
  let perpMix = clamp(
    (length(parentXY.perp) + length(parentYZ.perp) + length(parentZX.perp)) / 9.0,
    0.0, 1.0);
  let hierarchy = clamp(
    1.0 - min(parentEdgeXY, min(parentEdgeYZ, parentEdgeZX)) / PARENT_W,
    0.0, 1.0);
  res.trap = 0.10 + 0.34 * kindMix + 0.28 * perpMix + 0.22 * hierarchy;
  return res;
}
'''
          replace_once(shader, "\n// Dispatch to the selected estimator.\n", sponge + "\n// Dispatch to the selected estimator.\n")

          replace_once(shader, """  } else if (ft < 7.5) {
    return deSurfacePack(pos);
  }
  return dePenrose(pos);
}""", """  } else if (ft < 7.5) {
    return deSurfacePack(pos);
  } else if (ft < 8.5) {
    return dePenrose(pos);
  }
  return dePenroseSponge(pos);
}""")

          replace_once(shader, """  const SH_STEPS : i32 = 40;
  for (var i = 0; i < SH_STEPS; i = i + 1) {
    let h = mapDist(ro + rd * t);""", """  const SH_STEPS : i32 = 40;
  let activeSteps = select(40, 18, u.fractalType > 8.5 && u.fractalType < 9.5);
  for (var i = 0; i < SH_STEPS; i = i + 1) {
    if (i >= activeSteps) { break; }
    let h = mapDist(ro + rd * t);""")

          replace_once(shader, """  const AO_STEPS : i32 = 5;
  for (var i = 0; i < AO_STEPS; i = i + 1) {
    let hr = 0.01 + 0.14 * f32(i) / 4.0;""", """  const AO_STEPS : i32 = 5;
  let activeSteps = select(5, 3, u.fractalType > 8.5 && u.fractalType < 9.5);
  for (var i = 0; i < AO_STEPS; i = i + 1) {
    if (i >= activeSteps) { break; }
    let hr = 0.01 + 0.14 * f32(i) / 4.0;""")

          replace_once(shader, "if (u.fractalType > 8.5) {", "if (u.fractalType > 9.5) {")

          js = 'src/fractal-bg.js'
          replace_once(js, """// Distance-estimated fractals occupy ids 0..8; the volumetric/line-rendered
// attractors follow at 9+. The shader keys off that split (see the
// `fractalType > 8.5` test in fractal.wgsl.js), so keep DE types contiguous at
// the front when adding new ones and move the attractors up to match.
const FRACTAL_IDS = {
  mandelbulb: 0, mandelbox: 1, menger: 2, julia: 3, apollonian: 4,
  spherepack: 5, encrusted: 6, surfacepack: 7, penrose: 8,
  attractor: 9, lorenz: 10,
};""", """// Distance-estimated fractals occupy ids 0..9; the line-rendered
// attractors follow at 10+. The shader keys off that split (see the
// `fractalType > 9.5` test in fractal.wgsl.js), so keep DE types contiguous at
// the front when adding new ones and move the attractors up to match.
const FRACTAL_IDS = {
  mandelbulb: 0, mandelbox: 1, menger: 2, julia: 3, apollonian: 4,
  spherepack: 5, encrusted: 6, surfacepack: 7, penrose: 8,
  'penrose-sponge': 9, attractor: 10, lorenz: 11,
};""")

          replace_once(js, """// mandelbulb, mandelbox, menger, julia, apollonian, spherepack, encrusted,
// surfacepack, penrose, attractor(Aizawa), lorenz
// The Penrose disc is wide and flat, so it needs a little more room than the
// roughly ball-shaped estimators to sit inside the frame edge-on.
const CAM_RADIUS = [2.55, 6.5, 3.6, 3.0, 3.0, 2.9, 3.1, 3.0, 3.5, 3.2, 3.0];""", """// mandelbulb, mandelbox, menger, julia, apollonian, spherepack, encrusted,
// surfacepack, Penrose relief, Penrose sponge, attractor(Aizawa), lorenz
// The relief disc needs extra room edge-on; the volumetric sponge uses framing
// similar to the other roughly spherical distance-estimated models.
const CAM_RADIUS = [2.55, 6.5, 3.6, 3.0, 3.0, 2.9, 3.1, 3.0, 3.5, 3.25, 3.2, 3.0];""")

          index = 'index.html'
          replace_once(index, """        <option value="penrose">Penrose quasicrystal (tiled disc)</option>""", """        <option value="penrose">Penrose relief (tiled disc)</option>
        <option value="penrose-sponge">Penrose sponge (volumetric)</option>""")
          replace_once(index, """      const names = ['mandelbulb', 'mandelbox', 'menger', 'julia', 'apollonian',
        'spherepack', 'encrusted', 'surfacepack', 'penrose', 'attractor', 'lorenz'];""", """      const names = ['mandelbulb', 'mandelbox', 'menger', 'julia', 'apollonian',
        'spherepack', 'encrusted', 'surfacepack', 'penrose', 'penrose-sponge',
        'attractor', 'lorenz'];""")

          readme = 'README.md'
          replace_once(readme, "- Penrose quasicrystal tiling", "- Penrose quasicrystal relief disc\n- Volumetric Penrose sponge")
          replace_once(readme, "`'surfacepack'`, `'penrose'`, `'attractor'`", "`'surfacepack'`, `'penrose'`, `'penrose-sponge'`, `'attractor'`")
          replace_once(readme, """- **Penrose quasicrystal:** a true P3 rhombus tiling engraved into a disc at two levels of its inflation hierarchy""", """- **Penrose relief:** a true P3 rhombus tiling engraved into a disc at two levels of its inflation hierarchy
- **Penrose sponge:** a spherical solid carved by intersecting Penrose edge fields on three perpendicular planes at fine and φ² parent scales""")
          replace_once(readme, "#### Penrose quasicrystal", "#### Penrose relief")
          replace_once(readme, "\n### Strange attractors\n", """
#### Penrose sponge

The volumetric model evaluates independently phased Penrose tilings on the XY, YZ, and ZX planes. Each tile-edge field is extruded through the host volume, and the pairwise intersections of those sheets become branching tunnels. The same construction runs again at the φ² parent scale, producing broad passages that contain a finer self-similar network.

A spherical host keeps the first implementation compact and fully explorable from every direction. The tunnels reach the exterior, exposing internal chambers and passages as the camera orbits and zooms. Phason drift changes all three quasicrystalline fields over time while preserving valid Penrose structure. Because this estimator performs six pentagrid queries per distance sample, its soft-shadow and ambient-occlusion sample counts are reduced specifically for this model.

### Strange attractors
""")

          Path('.github/workflows/penrose-sponge-once.yml').unlink()
          PY

      - name: Validate JavaScript and wiring
        shell: bash
        run: |
          node --check src/fractal-bg.js
          node --check src/shaders/fractal.wgsl.js
          grep -q "fn dePenroseSponge" src/shaders/fractal.wgsl.js
          grep -q "'penrose-sponge': 9" src/fractal-bg.js
          grep -q 'value="penrose-sponge"' index.html
          grep -q "Penrose sponge" README.md

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add volumetric Penrose sponge model"
          git push
