name: Apply Penrose Sponge once

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Run Penrose Sponge patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add volumetric Penrose model
        run: python3 tools/apply-penrose-sponge.py

      - name: Validate JavaScript and wiring
        shell: bash
        run: |
          node --check src/fractal-bg.js
          node --check src/shaders/fractal.wgsl.js
          grep -q "fn dePenroseSponge" src/shaders/fractal.wgsl.js
          grep -q "'penrose-sponge': 9" src/fractal-bg.js
          grep -q 'value="penrose-sponge"' index.html
          grep -q "Penrose sponge" README.md

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add volumetric Penrose sponge model"
          git push
