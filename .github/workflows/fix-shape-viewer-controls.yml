name: Fix shape viewer controls

on:
  push:
    branches:
      - fix/shape-viewer-controls

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shape-viewer-controls
          fetch-depth: 0

      - name: Patch shape viewer
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_viewer.py
          python3 /tmp/patch_viewer.py
          node --check /tmp/index-script.mjs

      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/fix-shape-viewer-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-shape-viewer-controls.yml
          git commit -m "Restore shape viewer controls"
          git push origin HEAD:fix/shape-viewer-controls
