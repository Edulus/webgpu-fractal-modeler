name: Fix seamless presentation

on:
  push:
    branches: [fix/seamless-presentation]

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seamless-presentation
          fetch-depth: 0

      - name: Apply presentation patch
        run: python3 tools/patch_seamless_presentation.py

      - name: Syntax checks
        run: |
          node --check src/fractal-bg.js
          node --check tools/presentation.test.js

      - name: Run full test suite
        run: |
          for test in tools/*.test.js; do
            echo "== $test =="
            node "$test"
          done

      - name: Commit validated implementation
        run: |
          rm .github/workflows/fix-seamless-presentation.yml tools/patch_seamless_presentation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep landing presentation in Shape Explorer"
          git push origin HEAD:fix/seamless-presentation
