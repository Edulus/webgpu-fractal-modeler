name: Fix color-shift shader gate

on:
  push:
    branches: [fix/color-shift-shader-gate]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/color-shift-shader-gate
          fetch-depth: 0
      - name: Patch and test color shifting
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_color_shift_shader.py
          node --check src/shaders/composite.wgsl.js
          node tools/colorcycle.test.js
          node tools/camera.test.js
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-color-shift-shader.yml tools/patch_color_shift_shader.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix desktop colour-shift shader gate"
          git push origin HEAD:fix/color-shift-shader-gate
